<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>民間公證人 三民公證所 - 應備文件</title>
  <!-- 引入 FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* 全局樣式重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: #fdfaf7;
      color: #333;
    }

    /* 1. 頂部導覽列 (Header) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      height: 45px; /* 品牌 Logo */
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #a83232;
    }

    .header-icons {
      display: flex;
      gap: 12px;
      margin-left: 10px;
      font-size: 18px;
      color: #555;
    }

    /* 2. Hero Banner 區塊 */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 260px;
      /* 木紋與花卉背景圖 */
      background: linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)), 
                  url('https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-title {
      font-size: 32px;
      color: #222;
      letter-spacing: 4px;
      text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
      font-weight: 600;
    }

    /* 麵包屑導航 */
    .breadcrumb-container {
      max-width: 1200px;
      margin: 15px auto;
      padding: 0 20px;
      text-align: right;
      font-size: 14px;
      color: #666;
    }

    .breadcrumb-container a {
      color: #666;
      text-decoration: none;
    }

    .breadcrumb-container a:hover {
      text-decoration: underline;
    }

    /* 3. 主要內容區域 (Main Content) */
    .container {
      max-width: 1200px;
      margin: 20px auto 60px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 30px;
    }

    /* 左側邊欄 Sidebar */
    .sidebar-title {
      font-size: 20px;
      font-weight: normal;
      color: #444;
      margin-bottom: 20px;
    }

    .sidebar-title span {
      font-family: serif;
      font-style: italic;
      color: #777;
    }

    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 35px 10px 15px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      background-color: #fff;
    }

    .search-box i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
    }

    .category-list {
      list-style: none;
    }

    .category-item {
      padding: 12px 20px;
      background: #f0ebe5;
      border-radius: 20px;
      margin-bottom: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .category-item:hover, .category-item.active {
      background: #e6ded5;
    }

    /* 右側文章列表 Content Grid */
    .article-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .article-card {
      display: flex;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #f0f0f0;
    }

    .card-thumb {
      width: 120px;
      height: 120px;
      background-color: #fcebe8; /* 粉紅底色 */
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .card-thumb img {
      width: 60px;
      height: 60px;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-title {
      font-size: 18px;
      color: #333;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .card-date {
      font-size: 13px;
      color: #888;
    }

    /* 4. 右下角懸浮社群按鈕 (Floating Socials) */
    .floating-socials {
      position: fixed;
      right: 20px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
    }

    .social-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      text-decoration: none;
      transition: transform 0.2s;
    }

    .social-btn:hover {
      transform: scale(1.1);
    }

    .btn-fb { background-color: #3b5998; }
    .btn-line { background-color: #06c755; }
    .btn-phone { background-color: #f37023; }
    .btn-msg { background-color: #0084ff; }

    /* 響應式調整 (Mobile Adaptive) */
    @media (max-width: 768px) {
      header { padding: 15px 20px; flex-direction: column; gap: 15px; }
      nav { flex-wrap: wrap; justify-content: center; }
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 1. Header 頁首導覽 -->
  <header>
    <div class="logo-container">
      <!-- 標誌預設圖示替代 -->
      <i class="fa-solid fa-stamp" style="font-size: 30px; color: #a83232;"></i>
      <div>
        <span style="font-size: 12px; color: #888; display: block;">民間公證人</span>
        <strong style="font-size: 20px; color: #222;">三民公正</strong>
      </div>
    </div>

    <nav>
      <a href="#">本所簡介 <i class="fa-solid fa-angle-down" style="font-size: 12px;"></i></a>
      <a href="#">公證項目</a>
      <a href="#">應備文件 <i class="fa-solid fa-angle-down" style="font-size: 12px;"></i></a>
      <a href="#">費用標準</a>
      <a href="#">範本下載</a>
      <a href="#">最新消息</a>
      <a href="#">聯絡我們</a>
      <div class="header-icons">
        <i class="fa-brands fa-whatsapp"></i>
        <i class="fa-regular fa-envelope"></i>
      </div>
    </nav>
  </header>

  <!-- 2. Hero Banner 與橫幅標題 -->
  <section class="hero-banner">
    <h1 class="hero-title">應備文件</h1>
  </section>

  <!-- 麵包屑導航 (Breadcrumb) -->
  <div class="breadcrumb-container">
    <a href="#">首頁</a> &gt; <span>應備文件</span>
  </div>

  <!-- 3. 主要內容區域 -->
  <main class="container">
    
    <!-- 左側分類與搜尋 (Sidebar) -->
    <aside>
      <h2 class="sidebar-title">文章分類 <span>Article</span></h2>
      <div class="search-box">
        <input type="text" placeholder="文章搜尋">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <ul class="category-list">
        <li class="category-item active">應備文件</li>
      </ul>
    </aside>

    <!-- 右側卡片列表 (Article Cards) -->
    <section class="article-grid">
      
      <!-- 卡片 1 -->
      <div class="article-card">
        <div class="card-thumb">
          <!-- 替代圖示 (Logo 樣式) -->
          <i class="fa-solid fa-file-contract" style="font-size: 35px; color: #a83232;"></i>
        </div>
        <div class="card-content">
          <h3 class="card-title">租賃契約公證</h3>
          <span class="card-date">發佈：2021/05/13</span>
        </div>
      </div>

      <!-- 卡片 2 -->
      <div class="article-card">
        <div class="card-thumb">
          <i class="fa-solid fa-scroll" style="font-size: 35px; color: #a83232;"></i>
        </div>
        <div class="card-content">
          <h3 class="card-title">遺囑應備文件</h3>
          <span class="card-date">發佈：2021/05/13</span>
        </div>
      </div>

    </section>

  </main>

  <!-- 4. 右下角懸浮按鈕區塊 -->
  <div class="floating-socials">
    <a href="#" class="social-btn btn-fb"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="#" class="social-btn btn-line"><i class="fa-brands fa-line"></i></a>
    <a href="#" class="social-btn btn-phone"><i class="fa-solid fa-phone"></i></a>
    <a href="#" class="social-btn btn-msg"><i class="fa-brands fa-facebook-messenger"></i></a>
  </div>

</body>
</html>
