<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金錢借貸公證 - 民間公證人 三民公證所</title>
  <!-- 引入 FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 1. Header 頁首導覽 -->
  <div id="header-container"></div>

  <!-- 2. Hero Banner 與橫幅標題 -->
  <section class="hero-banner">
    <h1 class="hero-title">公證效力及費用與法院相同</h1>
  </section>

  <!-- 麵包屑導航 (Breadcrumb) -->
  <div class="breadcrumb-container">
    <a href="home.html">首頁</a> 
  </div>

  <!-- 3. 主要內容區域 -->
  <main class="container">
    

    <a>地圖圖片放置處</a>


  </main>

  <!-- 4. 右下角懸浮按鈕區塊 -->
  <div class="floating-socials">
    <a href="#" class="social-btn btn-fb"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="#" class="social-btn btn-line"><i class="fa-brands fa-line"></i></a>
    <a href="#" class="social-btn btn-phone"><i class="fa-solid fa-phone"></i></a>
    <a href="#" class="social-btn btn-msg"><i class="fa-brands fa-facebook-messenger"></i></a>
  </div>

  <div id="footer-container"></div>
 
  <script>
      // 載入 Header
      fetch('header.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('header-container').innerHTML = data;
        });

      // 載入 Footer
      fetch('footer.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('footer-container').innerHTML = data;
        });
    </script>
</body>
</html>
