<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>房屋租約 - 公證費線上試算</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: #f8f9fa;
      color: #333;
      padding: 40px 20px;
    }

    .calc-card {
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h2 {
      font-size: 24px;
      color: #0066cc;
      margin-bottom: 20px;
      border-bottom: 2px solid #0066cc;
      padding-bottom: 10px;
    }

    .calc-form .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #444;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: #0066cc;
      outline: none;
    }

    .unit {
      white-space: nowrap;
      font-weight: 500;
      color: #666;
    }

    .note {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
      line-height: 1.5;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: normal;
    }

    .btn-calc {
      width: 100%;
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-calc:hover {
      background-color: #004b99;
    }

    /* 結果顯示區 */
    .result-box {
      margin-top: 25px;
      padding: 20px;
      background-color: #f0f7ff;
      border-left: 5px solid #0066cc;
      border-radius: 4px;
      display: none;
    }

    .result-box.active {
      display: block;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .result-total {
      font-size: 20px;
      font-weight: bold;
      color: #d9534f;
      border-top: 1px dashed #bbb;
      padding-top: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="calc-card">
    <h2>房屋租約 — 公證費試算</h2>

    <div class="calc-form">
      <!-- 月租金 -->
      <div class="form-group">
        <label for="monthlyRent">月租金：</label>
        <div class="input-row">
          <input type="number" id="monthlyRent" placeholder="請輸入月租金" oninput="autoCalcTotalRent()">
          <span class="unit">元</span>
        </div>
      </div>

      <!-- 租期 -->
      <div class="form-group">
        <label>租期：</label>
        <div class="input-row">
          <input type="number" id="rentYears" value="1" min="0" oninput="autoCalcTotalRent()">
          <span class="unit">年</span>
          <input type="number" id="rentMonths" value="0" min="0" max="11" oninput="autoCalcTotalRent()">
          <span class="unit">個月</span>
        </div>
        <p class="note">填寫說明：若租期為 3 年，請填 3 年 0 個月。</p>
      </div>

      <!-- 租金總額 -->
      <div class="form-group">
        <label for="totalRent">租金總額：</label>
        <div class="input-row">
          <input type="number" id="totalRent" placeholder="自動計算或自行填寫">
          <span class="unit">元</span>
        </div>
      </div>

      <!-- 押金 -->
      <div class="form-group">
        <label for="deposit">押金：</label>
        <div class="input-row">
          <input type="number" id="deposit" placeholder="請輸入押金金額" value="0">
          <span class="unit">元</span>
        </div>
      </div>

      <!-- 房屋課稅現值 -->
      <div class="form-group">
        <label for="taxValue">房屋課稅現值：</label>
        <div class="input-row">
          <input type="number" id="taxValue" placeholder="若無可不填" value="0">
          <span class="unit">元</span>
        </div>
        <p class="note">(請參考最新一期房屋稅稅單或房屋稅籍證明書的「房屋課稅現值」)</p>
      </div>

      <!-- 是否約定強制執行 -->
      <div class="form-group">
        <label>是否約定「附加逕受強制執行」？</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="execution" value="yes" checked> 是 (費用加收 50%)</label>
          <label class="radio-label"><input type="radio" name="execution" value="no"> 否</label>
        </div>
      </div>

      <!-- 夜間/假日辦理 -->
      <div class="form-group">
        <label>是否於假日或夜間辦理公證？</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="holiday" value="yes"> 是</label>
          <label class="radio-label"><input type="radio" name="holiday" value="no" checked> 否</label>
        </div>
        <p class="note">*說明：夜間 (17:30以後) 或例假日辦理，費用加收50% (加收部分上限最高為 5,000 元)。</p>
      </div>

      <button class="btn-calc" onclick="calculateFee()">開始試算公證費</button>
    </div>

    <!-- 試算結果顯示區 -->
    <div class="result-box" id="resultBox">
      <div class="result-row">
        <span>計算標準一（租金總額 + 押金）：</span>
        <strong id="resStd1">0 元</strong>
      </div>
      <div class="result-row">
        <span>計算標準二（課稅現值 + 押金）：</span>
        <strong id="resStd2">0 元</strong>
      </div>
      <div class="result-row">
        <span>採計之標的金額（取高者）：</span>
        <strong id="resFinalTarget" style="color: #0066cc;">0 元</strong>
      </div>
      <div class="result-row">
        <span>基本公證費用：</span>
        <strong id="resBaseFee">0 元</strong>
      </div>
      <div class="result-row" id="holidayFeeRow" style="display:none;">
        <span>夜間/假日加收費用：</span>
        <strong id="resHolidayFee">0 元</strong>
      </div>
      <div class="result-row result-total">
        <span>預估總公證費用：</span>
        <span id="resTotalFee">0 元</span>
      </div>
    </div>
  </div>

  <script>
    // 自動計算租金總額
    function autoCalcTotalRent() {
      const rent = parseFloat(document.getElementById('monthlyRent').value) || 0;
      const years = parseFloat(document.getElementById('rentYears').value) || 0;
      const months = parseFloat(document.getElementById('rentMonths').value) || 0;
      
      const totalMonths = (years * 12) + months;
      document.getElementById('totalRent').value = rent * totalMonths;
    }

    // 司法院公證費級距查詢函數
    function getNotaryBaseFee(amount) {
      if (amount <= 200000) return 1000;
      if (amount <= 500000) return 1500;
      if (amount <= 1000000) return 3000;
      if (amount <= 2000000) return 4500;
      if (amount <= 5000000) return 5000;
      if (amount <= 10000000) return 6000;
      if (amount <= 20000000) return 8000;
      if (amount <= 50000000) return 10000;
      
      // 超過 5000 萬，每增加 1000 萬加收 1000 元
      const overAmount = amount - 50000000;
      const extraTenMillion = Math.ceil(overAmount / 10000000);
      return 10000 + (extraTenMillion * 1000);
    }

    // 主試算邏輯
    function calculateFee() {
      const totalRent = parseFloat(document.getElementById('totalRent').value) || 0;
      const deposit = parseFloat(document.getElementById('deposit').value) || 0;
      const taxValue = parseFloat(document.getElementById('taxValue').value) || 0;
      
      const hasExecution = document.querySelector('input[name="execution"]:checked').value === 'yes';
      const isHoliday = document.querySelector('input[name="holiday"]:checked').value === 'yes';

      // 1. 計算兩標準金額
      const std1 = totalRent + deposit;
      const std2 = taxValue + deposit;
      const finalTarget = Math.max(std1, std2);

      if (finalTarget <= 0) {
        alert("請輸入有效的租金或金額！");
        return;
      }

      // 2. 計算基礎公證費 (非強制執行)
      let baseFee = getNotaryBaseFee(finalTarget);

      // 3. 是否有附加逕受強制執行（加收 50%，即乘以 1.5）
      if (hasExecution) {
        baseFee = baseFee * 1.5;
      }

      // 4. 計算夜間/假日加成（加收 50%，但加收上限 5,000 元）
      let holidayFee = 0;
      if (isHoliday) {
        holidayFee = Math.min(baseFee * 0.5, 5000);
      }

      const totalFee = baseFee + holidayFee;

      // 5. 渲染結果到畫面
      document.getElementById('resStd1').innerText = std1.toLocaleString() + ' 元';
      document.getElementById('resStd2').innerText = std2.toLocaleString() + ' 元';
      document.getElementById('resFinalTarget').innerText = finalTarget.toLocaleString() + ' 元';
      document.getElementById('resBaseFee').innerText = baseFee.toLocaleString() + ' 元';

      if (isHoliday) {
        document.getElementById('holidayFeeRow').style.display = 'flex';
        document.getElementById('resHolidayFee').innerText = holidayFee.toLocaleString() + ' 元';
      } else {
        document.getElementById('holidayFeeRow').style.display = 'none';
      }

      document.getElementById('resTotalFee').innerText = totalFee.toLocaleString() + ' 元';
      document.getElementById('resultBox').classList.add('active');
    }
  </script>
</body>
</html>
