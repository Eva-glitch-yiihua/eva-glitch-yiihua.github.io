<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金錢借貸公證 - 三民公證</title>
  <!-- 引入 FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<!-- 聯絡方式區塊開始 -->
<body>
<div id="header-container"></div>
<section style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; max-width: 1000px; margin: 40px auto; padding: 0 20px;">
  <div id="header-container"></div>
  <!-- 上方標題區 -->
  <div style="text-align: center; margin-bottom: 40px;">
    <h2 style="font-size: 28px; font-weight: normal; margin-bottom: 10px;">聯絡方式</h2>
    <!-- <p style="color: #666; font-size: 15px;">
      進一步瞭解我們的 <a href="#" style="color: #1b2fc5; text-decoration: none;">服務區域</a>
    </p> -->
  </div>

  <!-- 左右兩欄容器 -->
  <div style="display: flex; flex-wrap: wrap; gap: 50px; justify-content: space-between;">
    
    <!-- 左欄：與我們聯繫 Contact -->
    <div style="flex: 1; min-width: 300px;">
      <h3 style="font-size: 24px; font-weight: normal; margin-bottom: 20px; color: #333;">
        與我們聯繫 <span style="font-family: Arial, sans-serif; color: #555;">Contact</span>
      </h3>

      <p style="margin-bottom: 15px; color: #555;">後驛捷運站 2 號出口旁</p>

      <!-- 交通/停車示意圖連結 -->
      <p style="margin-bottom: 20px;">
        <a href="https://www.google.com/maps/search/?api=1&query=高雄市博愛一路200號1樓" target="_blank" rel="noopener noreferrer" style="color: #333; text-decoration: underline;">
          交通/停車示意圖
        </a>
      </p>

      <!-- 中英文地址 -->
      <p style="margin: 6px 0;">
        <a href="https://www.google.com/maps/search/?api=1&query=高雄市博愛一路200號1樓" target="_blank" rel="noopener noreferrer" style="color: #333; text-decoration: underline;">
          807高雄市博愛一路200號1樓
        </a>
      </p>
      <p style="margin: 6px 0; font-size: 14px;">
        <a href="https://www.google.com/maps/search/?api=1&query=高雄市博愛一路200號1樓" target="_blank" rel="noopener noreferrer" style="color: #666; text-decoration: underline;">
          1F., No. 200, Bo' ai 1st Rd., Sanmin Dist., Kaohsiung City 807, Taiwan (R.O.C.)
        </a>
      </p>

      <!-- Email -->
      <p style="margin: 12px 0;">
        <a href="mailto:whatislaw@gmail.com" style="color: #333; text-decoration: underline;">
          whatislaw@gmail.com
        </a>
      </p>

      <!-- 電話與傳真 -->
      <p style="margin: 6px 0; color: #555;">TEL (07) 313-1234</p>
      <p style="margin: 6px 0; color: #555;">FAX (07) 322-9888</p>

      <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

      <!-- LINE 聯絡 -->
      <p style="margin-top: 15px;">
        <a href="https://line.me/R/ti/p/@notary" target="_blank" rel="noopener noreferrer" style="color: #333; text-decoration: underline;">
          LINE @notary
        </a>
      </p>
    </div>

    <!-- 右欄：歡迎預約諮詢 Make an Appointment -->
    <div style="flex: 1; min-width: 300px;">
      <h3 style="font-size: 24px; font-weight: normal; margin-bottom: 20px; color: #333;">
        歡迎預約諮詢 <span style="font-family: Arial, sans-serif; color: #555;">Make an Appointment</span>
      </h3>

      <form action="#" method="post">
        <!-- 姓名 -->
        <div style="margin-bottom: 18px;">
          <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px;">
            姓名 Name <span style="font-weight: normal; color: #666;">(必)</span>
          </label>
          <input type="text" required style="width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 2px; box-sizing: border-box;">
        </div>

        <!-- 電子郵件 -->
        <div style="margin-bottom: 18px;">
          <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px;">
            電子郵件信箱 Email <span style="font-weight: normal; color: #666;">(必)</span>
          </label>
          <input type="email" required style="width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 2px; box-sizing: border-box;">
        </div>

        <!-- 電話 -->
        <div style="margin-bottom: 18px;">
          <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px;">
            電話 Tel <span style="font-weight: normal; color: #666;">(必)</span>
          </label>
          <input type="tel" required style="width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 2px; box-sizing: border-box;">
        </div>

        <!-- 諮詢內容 -->
        <div style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px;">
            諮詢內容 Request <span style="font-weight: normal; color: #666;">(必)</span>
          </label>
          <textarea rows="6" required style="width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 2px; box-sizing: border-box; resize: vertical;"></textarea>
        </div>

        <!-- 送出按鈕 -->
        <button type="submit" style="background-color: #3a32a8;; color: white; border: none; padding: 8px 24px; font-size: 15px; border-radius: 4px; cursor: pointer;">
          送出
        </button>
      </form>
    </div>

  </div>

  <script>
      // 載入 Header
      fetch('header.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('header-container').innerHTML = data;
        });

      // 載入 Footer
      fetch('footer.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('footer-container').innerHTML = data;
        });
    </script>
</section>
<!-- 聯絡方式區塊結束 -->
</body>
 </html>
